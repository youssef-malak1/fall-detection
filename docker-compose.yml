services:
  fall-detection:
    build: .
    image: elderlife-fall:1.0.0
    container_name: elderlife-fall
    ports:
      - "8100:8100"
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"
      interval: 30s
      timeout: 5s
      retries: 3
